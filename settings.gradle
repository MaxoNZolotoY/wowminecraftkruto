pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'wowcraft'

// Pure-Java game logic (classes, spells, Mythic+, PvP, bots...). Builds and tests without Minecraft.
include 'core'

// The Minecraft (Fabric) adapter. Skip it with -PcoreOnly when Minecraft/Fabric mavens are unreachable.
if (!providers.gradleProperty('coreOnly').isPresent()) {
    include 'fabric'
}
