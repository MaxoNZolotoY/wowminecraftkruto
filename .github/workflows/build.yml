name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build Fabric mod
        run: |
          ./gradlew :fabric:build --no-daemon --stacktrace
          jar=$(ls fabric/build/libs/wowcraft-*.jar | grep -v sources | head -1)
          unzip -l "$jar" | grep -E "refmap|mixins.json"
          unzip -p "$jar" wowcraft.mixins.json | grep -q '"refmap"'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: wowcraft-mod
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Server smoke test
        run: |
          mkdir -p fabric/run-smoke
          echo "eula=true" > fabric/run-smoke/eula.txt
          printf 'level-type=minecraft\\:flat\nspawn-protection=0\nonline-mode=false\nview-distance=4\nsimulation-distance=4\n' > fabric/run-smoke/server.properties
          timeout 900 ./gradlew :fabric:runSmoke --no-daemon > smoke.log 2>&1 || true
          grep -E "smoke|WoWCraft|ERROR|Exception|Done \\(" smoke.log | tail -120
          grep -q "WOWCRAFT SMOKE TEST PASSED" smoke.log

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore

      - name: Client smoke test (virtual display)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri > /dev/null
          mkdir -p fabric/run-client
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:5\nguiScale:2\nlang:en_us\nsoundCategory_master:0.0\nskipMultiplayerWarning:true\ntutorialStep:none\n' > fabric/run-client/options.txt
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientSmoke --no-daemon > client.log 2>&1 || true
          grep -E "client-smoke|WoWCraft|ERROR|Exception|Crash|OpenGL|Backend library" client.log | tail -150
          grep -q "WOWCRAFT CLIENT SMOKE TEST PASSED" client.log

      - name: Upload client smoke test log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke
          path: |
            client.log
            fabric/run-client/screenshots/
            fabric/run-client/crash-reports/
            fabric/run-client/logs/latest.log
          if-no-files-found: ignore
