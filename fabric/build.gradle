plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "wowcraft" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        // Headless server self-test used by CI: ./gradlew :fabric:runSmoke
        smoke {
            server()
            name "WoWCraft smoke test"
            vmArg "-Dwowcraft.smoke=true"
            programArg "--nogui"
            runDir "run-smoke"
            ideConfigGenerated false
        }
    }
}

// The pure-Java core is compiled straight into the mod jar (no extra library jar to ship).
sourceSets {
    main {
        java {
            srcDir project(':core').file('src/main/java')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
